# Baseline: FFS (Buch et al. CVPR'25), k=4 with 3 [CTRL] tokens -> 1..4 frames
out_dir: runs_dummy/ffs
data_dir: features_dummy
downstream: runs_dummy/downstream/downstream.pt
seed: 0
split_seed: 0
dev_frac: 0.1
device: auto
epochs: 10
batch_size: 64
lr: 3.0e-4
weight_decay: 0.05
lambda_count: 1.0   # aux frame-count supervision from fixed-k policies (same for all flexible selectors)
lambda_budget: 0.0
lambda_red: 0.0
selector:
  d_model: 64
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  tau: 1.0
  k: 4
  n_ctrl: 3
  beta: 0.0
  learn_beta: false
